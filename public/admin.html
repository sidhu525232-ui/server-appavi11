<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>APPAVI KEY GENERATOR</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', monospace; }
  body { background: #07070a; color: #f4f4f5; min-height: 100vh; }
  .bg { position: fixed; inset: 0; background: url('background.gif') center/cover; opacity: .35; z-index: -1; }
  h1 { color: #ef4444; letter-spacing: 3px; font-size: 20px; text-shadow: 0 0 14px #ef4444; }
  .wrap { max-width: 1250px; margin: 0 auto; padding: 18px; }
  .bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .panel { background: rgba(12,4,6,.88); border: 1px solid #7f1d1d; border-radius: 10px; padding: 14px; margin-bottom: 14px; box-shadow: 0 0 25px rgba(239,68,68,.25); }
  label { font-size: 10px; font-weight: 900; color: #fca5a5; display: block; margin-bottom: 4px; letter-spacing: 1px; }
  input, select { background: #000; color: #fff; border: 1px solid #7f1d1d; border-radius: 6px; padding: 9px; font-size: 13px; }
  button { background: #b91c1c; color: #fff; border: 1px solid #f87171; border-radius: 6px; padding: 9px 14px; font-weight: 900; font-size: 12px; cursor: pointer; letter-spacing: .5px; }
  button.alt { background: #200408; color: #fca5a5; border-color: #7f1d1d; }
  button.sm { padding: 5px 8px; font-size: 10px; }
  button.danger { background: #450a0a; border-color: #ef4444; }
  .gen { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .stat { background: rgba(12,4,6,.88); border: 1px solid #450a0a; border-radius: 8px; padding: 8px 14px; font-size: 11px; color: #fca5a5; }
  .stat b { display: block; font-size: 20px; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th { text-align: left; color: #f87171; font-size: 10px; letter-spacing: 1px; padding: 8px 6px; border-bottom: 1px solid #7f1d1d; white-space: nowrap; }
  td { padding: 8px 6px; border-bottom: 1px solid #1f0b0e; vertical-align: middle; }
  td.key { font-weight: 900; letter-spacing: 1px; white-space: nowrap; }
  .badge { padding: 2px 7px; border-radius: 10px; font-size: 10px; font-weight: 900; }
  .b-unused { background: #27272a; color: #d4d4d8; } .b-active { background: #14532d; color: #86efac; }
  .b-unbound { background: #1e3a8a; color: #bfdbfe; } .b-expired { background: #422006; color: #fdba74; } .b-revoked { background: #7f1d1d; color: #fecaca; }
  .acts { display: flex; gap: 4px; flex-wrap: wrap; }
  .tablewrap { overflow-x: auto; }
  #login { max-width: 360px; margin: 14vh auto; text-align: center; }
  #login input { width: 100%; margin: 12px 0; text-align: center; }
  .err { color: #ef4444; font-size: 12px; font-weight: 900; min-height: 16px; }
  .newkeys { white-space: pre; font-size: 13px; background: #000; border: 1px dashed #ef4444; border-radius: 6px; padding: 10px; margin-top: 10px; user-select: all; max-height: 220px; overflow: auto; }
  .tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .muted { color: #8b8b93; }
</style>
</head>
<body>
<div class="bg"></div>

<div id="login" class="panel" style="display:none">
  <h1>🔒 APPAVI ADMIN</h1>
  <input id="pw" type="password" placeholder="ADMIN PASSWORD" autocomplete="current-password">
  <button id="loginBtn" style="width:100%">LOGIN</button>
  <div class="err" id="loginErr"></div>
</div>

<div id="app" class="wrap" style="display:none">
  <div class="bar"><h1>🔑 APPAVI KEY GENERATOR</h1><div><button class="alt" id="refresh">↻ REFRESH</button> <button class="alt" id="logout">LOGOUT</button></div></div>

  <div class="stats" id="stats"></div>

  <div class="panel">
    <div class="gen">
      <div><label>PLAN</label>
        <select id="plan"><option value="7">7 DAYS</option><option value="15">15 DAYS</option><option value="30" selected>30 DAYS</option><option value="lifetime">LIFETIME</option></select></div>
      <div><label>HOW MANY</label><input id="count" type="number" min="1" max="200" value="1" style="width:90px"></div>
      <div style="flex:1;min-width:200px"><label>CUSTOMER NOTE (optional)</label><input id="note" maxlength="120" style="width:100%" placeholder="name / phone / order id"></div>
      <button id="genBtn">⚡ GENERATE KEY</button>
    </div>
    <div class="muted" style="font-size:10px;margin-top:8px">Days start counting when the customer first activates the key. One key works on ONE device only.</div>
    <div id="newBox" style="display:none"><div class="newkeys" id="newKeys"></div><button class="alt sm" id="copyNew" style="margin-top:6px">COPY</button></div>
  </div>

  <div class="panel">
    <div class="tools">
      <input id="q" placeholder="search key / note / device…" style="flex:1;min-width:180px">
      <select id="fstatus"><option value="">ALL STATUS</option><option>unused</option><option>active</option><option>unbound</option><option>expired</option><option>revoked</option></select>
      <select id="fplan"><option value="">ALL PLANS</option><option value="7">7</option><option value="15">15</option><option value="30">30</option><option value="lifetime">LIFETIME</option></select>
    </div>
    <div class="tablewrap">
      <table><thead><tr><th>KEY</th><th>PLAN</th><th>STATUS</th><th>NOTE</th><th>DEVICE</th><th>ACTIVATED</th><th>EXPIRES</th><th>LAST SEEN</th><th>ACTIONS</th></tr></thead><tbody id="rows"></tbody></table>
    </div>
  </div>
</div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  let token = sessionStorage.getItem('appavi_admin_token') || '';
  let KEYS = [], NOW = Date.now();

  async function api(method, path, body) {
    const r = await fetch(path, { method, headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: body ? JSON.stringify(body) : undefined });
    const j = await r.json().catch(() => ({}));
    if (r.status === 401 && path !== '/api/admin/login') { logout(); }
    return j;
  }
  function logout() { token = ''; sessionStorage.removeItem('appavi_admin_token'); $('app').style.display = 'none'; $('login').style.display = 'block'; }
  const fmt = (t) => t ? new Date(t).toLocaleString() : '—';
  function left(k) {
    if (k.plan === 'lifetime') return '∞ lifetime';
    if (!k.expiresAt) return k.days + ' days after activation';
    let ms = k.expiresAt - NOW; if (ms <= 0) return 'expired ' + fmt(k.expiresAt);
    const d = Math.floor(ms / 86400000), h = Math.floor((ms % 86400000) / 3600000);
    return fmt(k.expiresAt) + ' (' + d + 'd ' + h + 'h left)';
  }
  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    Object.assign(e, props || {});
    kids.forEach((c) => e.append(c));
    return e;
  }

  async function load() {
    const j = await api('GET', '/api/admin/keys');
    if (!j.ok) return;
    KEYS = j.keys; NOW = j.now; render();
  }

  function render() {
    const cnt = { unused: 0, active: 0, unbound: 0, expired: 0, revoked: 0 };
    KEYS.forEach((k) => cnt[k.status]++);
    $('stats').replaceChildren(...[['TOTAL', KEYS.length], ['UNUSED', cnt.unused], ['ACTIVE', cnt.active], ['UNBOUND', cnt.unbound], ['EXPIRED', cnt.expired], ['REVOKED', cnt.revoked]]
      .map(([l, v]) => el('div', { className: 'stat' }, l, el('b', { textContent: v }))));

    const q = $('q').value.trim().toLowerCase(), fs = $('fstatus').value, fp = $('fplan').value;
    const rows = KEYS.filter((k) => (!fs || k.status === fs) && (!fp || k.plan === fp) &&
      (!q || (k.key + ' ' + (k.note || '') + ' ' + (k.deviceId || '')).toLowerCase().includes(q)));
    $('rows').replaceChildren(...rows.map((k) => {
      const tr = el('tr');
      const keyTd = el('td', { className: 'key' }, el('span', { textContent: k.key }), ' ', el('button', { className: 'alt sm', textContent: 'COPY', onclick: () => navigator.clipboard.writeText(k.key) }));
      const acts = el('div', { className: 'acts' });
      const act = (label, cls, fn) => acts.append(el('button', { className: 'sm ' + cls, textContent: label, onclick: fn }));
      if (k.status === 'revoked') act('RESTORE', 'alt', async () => { await api('POST', `/api/admin/keys/${k.id}/restore`); load(); });
      else act('EXPIRE NOW', 'danger', async () => { if (confirm('Expire this key now? The device is locked within ~2 minutes.')) { await api('POST', `/api/admin/keys/${k.id}/revoke`); load(); } });
      if (k.deviceId) act('RESET DEVICE', 'alt', async () => { if (confirm('Unbind this key from its device so it can be activated on a new one?')) { await api('POST', `/api/admin/keys/${k.id}/reset-device`); load(); } });
      if (k.plan !== 'lifetime') act('+DAYS', 'alt', async () => { const d = prompt('Add how many days?', '7'); if (d) { const r = await api('POST', `/api/admin/keys/${k.id}/extend`, { days: parseInt(d, 10) }); if (!r.ok) alert(r.message); load(); } });
      act('NOTE', 'alt', async () => { const n = prompt('Customer note', k.note || ''); if (n !== null) { await api('POST', `/api/admin/keys/${k.id}/note`, { note: n }); load(); } });
      act('DELETE', 'danger', async () => { if (confirm('Delete this key permanently?')) { await api('DELETE', `/api/admin/keys/${k.id}`); load(); } });
      tr.append(keyTd,
        el('td', { textContent: k.plan === 'lifetime' ? 'LIFETIME' : k.plan + ' DAYS' }),
        el('td', {}, el('span', { className: 'badge b-' + k.status, textContent: k.status.toUpperCase() })),
        el('td', { textContent: k.note || '' }),
        el('td', { textContent: k.deviceId ? k.deviceId.slice(0, 10) + '…' : '—', title: k.deviceId || '' }),
        el('td', { textContent: fmt(k.activatedAt) }),
        el('td', { textContent: left(k) }),
        el('td', { textContent: fmt(k.lastSeen) }),
        el('td', {}, acts));
      return tr;
    }));
  }

  $('loginBtn').onclick = async () => {
    $('loginErr').textContent = '';
    const j = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('pw').value }) }).then((r) => r.json()).catch(() => ({}));
    if (j.ok) { token = j.token; sessionStorage.setItem('appavi_admin_token', token); $('pw').value = ''; start(); }
    else $('loginErr').textContent = '❌ ' + (j.message || 'LOGIN FAILED');
  };
  $('pw').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('loginBtn').click(); });
  $('logout').onclick = logout;
  $('refresh').onclick = load;
  ['q', 'fstatus', 'fplan'].forEach((id) => $(id).addEventListener('input', render));

  $('genBtn').onclick = async () => {
    const j = await api('POST', '/api/admin/keys', { plan: $('plan').value, count: parseInt($('count').value, 10) || 1, note: $('note').value });
    if (!j.ok) return alert(j.message || 'failed');
    $('newBox').style.display = 'block';
    $('newKeys').textContent = j.keys.map((k) => k.key).join('\n');
    load();
  };
  $('copyNew').onclick = () => navigator.clipboard.writeText($('newKeys').textContent);

  function start() { $('login').style.display = 'none'; $('app').style.display = 'block'; load(); }
  if (token) { $('app').style.display = 'block'; load().then(() => { if (!KEYS.length && !token) logout(); }); } else $('login').style.display = 'block';
  setInterval(() => { if (token) load(); }, 30000);
})();
</script>
</body>
</html>
